[package]
name = "simple-textboard"
version = "0.1.3"
description = "A lightweight scratchpad for fleeting text"
authors = ["you"]
edition = "2021"

[lib]
name = "simple_textboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    name: Build universal macOS release
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify version tag
        run: test "${GITHUB_REF_NAME#v}" = "$(tr -d '[:space:]' < VERSION)"

      - name: Test and package universal app
        run: make archive

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Textboard ${{ github.ref_name }}
          body: |
            Textboard 已使用 SwiftUI 与 AppKit 完整重写为原生 macOS App。

            下载通用版本即可在 Apple Silicon 或 Intel Mac 上运行。发布包尚未经过 Apple Developer ID 公证，首次打开时可能需要在“隐私与安全性”中确认。
          generate_release_notes: true
          files: build/Textboard-*-macos-universal.zip
